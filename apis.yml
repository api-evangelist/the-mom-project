name: The Mom Project
description: 'The Mom Project is a talent marketplace that connects skilled professionals
  (with a focus on mothers and caregivers) to remote, hybrid, and onsite roles at
  family-friendly employers. The platform pairs a community of hundreds of thousands
  of vetted candidates with thousands of companies through job matching, curated
  talent search, and managed hiring services such as pay-per-hire and access plans.
  It was surfaced as a portfolio company of Initialized Capital and profiled in the
  API Evangelist network. As of this enrichment pass, The Mom Project operates a
  consumer/employer web product and consumes third-party APIs (for example a Docusign
  eSignature integration for hiring workflows) but does not publish a public developer
  portal, API reference, OpenAPI, or other machine-readable API surface of its own.'
